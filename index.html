<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamacavi — Sistemas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #05070d;
      --bg-card: rgba(18, 24, 42, 0.6);
      --bg-card-hover: rgba(24, 32, 54, 0.85);
      --texto: #e8eef9;
      --texto-suave: #8fa3c7;
      --acento: #4f8cff;
      --acento-2: #7c5cff;
      --acento-3: #00d4ff;
      --borda: rgba(79, 140, 255, 0.18);
      --grad: linear-gradient(135deg, var(--acento), var(--acento-2));
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-base);
      color: var(--texto);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Fundo com grades + orbes de luz ─────────────────── */
    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(79, 140, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79, 140, 255, 0.06) 1px, transparent 1px);
      background-size: 44px 44px;
      z-index: 0;
      mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 40%, transparent 100%);
      pointer-events: none;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.5;
      pointer-events: none;
    }
    .orb-1 { width: 480px; height: 480px; background: rgba(79, 140, 255, 0.25); top: -120px; left: -80px; }
    .orb-2 { width: 420px; height: 420px; background: rgba(124, 92, 255, 0.22); top: 10%; right: -120px; }
    .orb-3 { width: 300px; height: 300px; background: rgba(0, 212, 255, 0.16); bottom: -80px; left: 30%; }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 4rem 1.5rem 4rem;
      position: relative;
      z-index: 1;
    }

    /* ── Cabeçalho ───────────────────────────────────────── */
    header {
      text-align: center;
      margin-bottom: 3.5rem;
      position: relative;
    }

    .logo-wrap {
      position: relative;
      display: inline-flex;
      margin-bottom: 1.4rem;
    }
    .logo {
      width: 74px;
      height: 74px;
      border-radius: 20px;
      background: linear-gradient(135deg, #4f8cff, #7c5cff 60%, #00d4ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.1rem;
      font-weight: 800;
      color: white;
      box-shadow: 0 0 30px rgba(79,140,255,0.5), 0 0 80px rgba(124,92,255,0.25);
      position: relative;
      z-index: 1;
    }
    .logo-ring {
      position: absolute;
      inset: -12px;
      border-radius: 26px;
      border: 1px dashed rgba(79,140,255,0.5);
      animation: girar 16s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }

    .badge {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.35rem 1rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--acento-3);
      background: rgba(0, 212, 255, 0.08);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 40px;
      font-family: 'Space Grotesk', sans-serif;
    }

    header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 0.6rem;
      background: linear-gradient(90deg, #e8eef9, #9fc0ff 60%, #00d4ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--texto-suave);
      font-size: 1.1rem;
      max-width: 560px;
      margin: 0 auto;
    }

    /* ── Layout de 3 colunas ──────────────────────────────── */
    .colunas {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      align-items: start;
    }

    .coluna {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* ── Dropdown (menu suspenso) ─────────────────────────── */
    .dropdown {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--borda);
      border-radius: 14px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      overflow: visible;
    }

    .dropdown-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      padding: 1.2rem 1.4rem;
      background: none;
      border: none;
      color: var(--texto);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: color 0.2s ease;
    }

    .dropdown-btn:hover { color: var(--acento-3); }

    .chevron {
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 7px solid var(--texte-suave, #8fa3c7);
      transition: transform 0.25s ease;
      flex-shrink: 0;
    }
    .dropdown.aberto .chevron { transform: rotate(180deg); border-top-color: var(--acento-3); }

    .dropdown-menu {
      display: none;
      flex-direction: column;
      padding: 0.4rem;
      gap: 0.3rem;
    }
    .dropdown.aberto .dropdown-menu { display: flex; }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      color: var(--texto-suave);
      text-decoration: none;
      font-size: 0.92rem;
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }
    .dropdown-item:hover {
      background: var(--bg-card-hover);
      color: var(--acento-3);
      transform: translateX(3px);
    }
    .dropdown-item .icone { font-size: 1rem; }

    .dropdown-vazio {
      padding: 0.9rem 1rem;
      color: var(--texto-suave);
      font-size: 0.85rem;
      opacity: 0.7;
      font-style: italic;
    }

    /* ── Responsivo ──────────────────────────────────────── */
    @media (max-width: 768px) {
      .colunas { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="container">
    <header>
      <div class="logo-wrap">
        <div class="logo-ring"></div>
        <div class="logo">T</div>
      </div>
      <div class="badge">Sistema Central</div>
      <h1>Tamacavi</h1>
      <p>Uma porta de entrada tecnológica para todos os seus sistemas e ferramentas.</p>
    </header>

    <!-- Dropdowns gerados em 3 colunas -->
    <div class="colunas" id="colunasContainer"></div>

    <footer style="text-align:center;padding-top:2.2rem;border-top:1px solid var(--borda);color:var(--texto-suave);font-size:0.85rem;margin-top:3rem;">
      <span>© <span id="ano"></span> Tamacavi</span>
      <span style="margin:0 0.5rem;opacity:0.5;">•</span>
      <span>tamacavi.com.br</span>
    </footer>
  </div>

  <!-- Arquivo de configuração (edite este arquivo) -->
  <script src="sistemas.js"></script>

  <script>
    const container = document.getElementById('colunasContainer');
    document.getElementById('ano').textContent = new Date().getFullYear();

    // Categorias em 3 colunas
    const COLUNAS = ['financeira', 'agropecuaria', 'futura'];

    // Gera as 3 colunas com dropdowns
    container.innerHTML = COLUNAS.map(chave => {
      const cat = SISTEMAS[chave];
      if (!cat) return '';

      const itens = (cat.sistemas && cat.sistemas.length > 0)
        ? cat.sistemas.map(s =>
            `<a class="dropdown-item" href="${s.url}" target="_blank" rel="noopener">
               <span class="icone">${s.icone || '▸'}</span>${s.nome}
             </a>`).join('')
        : '<div class="dropdown-vazio">Nenhum sistema adicionado ainda.</div>';

      return `
        <div class="coluna">
          <div class="dropdown">
            <button class="dropdown-btn">
              <span>${cat.titulo}</span>
              <span class="chevron"></span>
            </button>
            <div class="dropdown-menu">${itens}</div>
          </div>
        </div>`;
    }).join('');

    // Lógica: clicar no botão abre/fecha o dropdown
    document.querySelectorAll('.dropdown-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const dd = btn.closest('.dropdown');
        // Fecha os outros dropdowns
        document.querySelectorAll('.dropdown.aberto').forEach(o => {
          if (o !== dd) o.classList.remove('aberto');
        });
        dd.classList.toggle('aberto');
      });
    });
  </script>
</body>
</html>
