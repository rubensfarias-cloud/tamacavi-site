<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamacavi — Sistemas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #04060c;
      --bg-card: rgba(13, 20, 38, 0.55);
      --bg-card-hover: rgba(20, 30, 56, 0.85);
      --texto: #eaf1ff;
      --texto-suave: #8fa6cc;
      --acento: #4f8cff;
      --acento-2: #7c5cff;
      --acento-3: #00d4ff;
      --verde: #2df1b0;
      --borda: rgba(79, 140, 255, 0.22);
      --grad: linear-gradient(135deg, var(--acento), var(--acento-2));
      --mono: 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-base);
      color: var(--texto);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
    }

    /* ═══ CANVAS DE PARTÍCULAS ═══ */
    #particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ═══ Fundo: grade + orbes + scanlines ═══ */
    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(79, 140, 255, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79, 140, 255, 0.07) 1px, transparent 1px);
      background-size: 46px 46px;
      z-index: 0;
      mask-image: radial-gradient(ellipse 92% 75% at 50% 0%, #000 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 92% 75% at 50% 0%, #000 40%, transparent 100%);
      pointer-events: none;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      opacity: 0.55;
      pointer-events: none;
      animation: orb-breathe 9s ease-in-out infinite;
    }
    .orb-1 { width: 520px; height: 520px; background: rgba(79, 140, 255, 0.28); top: -140px; left: -90px; }
    .orb-2 { width: 460px; height: 460px; background: rgba(124, 92, 255, 0.26); top: 8%; right: -140px; animation-delay: -3s; }
    .orb-3 { width: 340px; height: 340px; background: rgba(0, 212, 255, 0.18); bottom: -90px; left: 32%; animation-delay: -6s; }

    @keyframes orb-breathe {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
      50%      { transform: translateY(-18px) scale(1.06); opacity: 0.7; }
    }

    /* scanlines sutis estilo HUD */
    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 212, 255, 0.02) 3px,
        rgba(0, 212, 255, 0.02) 4px
      );
      opacity: 0.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 4rem;
      position: relative;
      z-index: 2;
    }

    /* ═══ Cabeçalho ═══ */
    header { text-align: center; margin-bottom: 3.5rem; position: relative; }

    .logo-wrap { position: relative; display: inline-flex; margin-bottom: 1.5rem; }

    .logo {
      width: 78px; height: 78px;
      border-radius: 22px;
      background: linear-gradient(135deg, #4f8cff, #7c5cff 60%, #00d4ff);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.2rem; font-weight: 800; color: white;
      box-shadow: 0 0 34px rgba(79,140,255,0.55), 0 0 90px rgba(124,92,255,0.3);
      position: relative; z-index: 1;
      animation: logo-glow 3.5s ease-in-out infinite;
    }
    @keyframes logo-glow {
      0%, 100% { box-shadow: 0 0 34px rgba(79,140,255,0.5), 0 0 80px rgba(124,92,255,0.25); }
      50%      { box-shadow: 0 0 46px rgba(0,212,255,0.65), 0 0 110px rgba(124,92,255,0.4); }
    }
    .logo-ring {
      position: absolute; inset: -14px; border-radius: 28px;
      border: 1px dashed rgba(0,212,255,0.55);
      animation: girar 14s linear infinite;
    }
    .logo-ring::after {
      content: '';
      position: absolute; top: -3px; left: 50%;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--acento-3); box-shadow: 0 0 12px var(--acento-3);
    }
    @keyframes girar { to { transform: rotate(360deg); } }

    .badge {
      display: inline-flex; align-items: center; gap: 0.5rem;
      margin-bottom: 1.1rem;
      padding: 0.4rem 1.1rem;
      font-size: 0.72rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      color: var(--acento-3);
      background: rgba(0, 212, 255, 0.07);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 40px;
      font-family: var(--mono);
    }
    .badge::before {
      content: '';
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--verde); box-shadow: 0 0 10px var(--verde);
      animation: blink 1.6s ease-in-out infinite;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 3.4rem; font-weight: 700; letter-spacing: -1px; margin-bottom: 0.7rem;
      background: linear-gradient(90deg, #eaf1ff, #9fc0ff 45%, #00d4ff 90%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--texto-suave);
      font-size: 1.12rem; max-width: 600px; margin: 0 auto;
    }

    /* ═══ Layout 3 colunas ═══ */
    .colunas {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.6rem;
      align-items: start;
      margin-top: 2.5rem;
    }
    .coluna { display: flex; flex-direction: column; gap: 1rem; }

    /* ═══ Dropdown (vidro) ═══ */
    .dropdown {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--borda);
      border-radius: 16px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      overflow: visible;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
    }
    .dropdown:hover { border-color: rgba(0,212,255,0.45); transform: translateY(-2px); }
    .dropdown.aberto {
      border-color: rgba(0,212,255,0.55);
      box-shadow: 0 0 0 1px rgba(0,212,255,0.15), 0 18px 60px rgba(0,0,0,0.45), 0 0 40px rgba(0,212,255,0.08);
    }

    .dropdown-btn {
      width: 100%;
      display: flex; align-items: center; justify-content: space-between; gap: 0.8rem;
      padding: 1.25rem 1.4rem;
      background: none; border: none;
      color: var(--texto);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem; font-weight: 600;
      cursor: pointer; text-align: left;
      transition: color 0.2s ease;
    }
    .dropdown-btn:hover { color: var(--acento-3); }

    .chevron {
      width: 0; height: 0;
      border-left: 6px solid transparent; border-right: 6px solid transparent;
      border-top: 7px solid var(--texto-suave);
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }
    .dropdown.aberto .chevron { transform: rotate(180deg); border-top-color: var(--acento-3); }

    .dropdown-menu {
      display: none;
      flex-direction: column;
      padding: 0.45rem;
      gap: 0.35rem;
      animation: menu-in 0.25s ease;
    }
    .dropdown.aberto .dropdown-menu { display: flex; }
    @keyframes menu-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

    .dropdown-item {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.8rem 1rem;
      border-radius: 11px;
      color: var(--texto-suave);
      text-decoration: none;
      font-size: 0.93rem;
      border: 1px solid transparent;
      transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease, border-color 0.18s ease;
    }
    .dropdown-item:hover {
      background: var(--bg-card-hover);
      color: var(--acento-3);
      transform: translateX(4px);
      border-color: rgba(0,212,255,0.25);
    }
    .dropdown-item .icone {
      font-size: 1.05rem;
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; flex-shrink: 0;
      border-radius: 8px;
      background: rgba(79,140,255,0.12);
      border: 1px solid rgba(79,140,255,0.2);
    }
    .dropdown-item:hover .icone { background: rgba(0,212,255,0.15); border-color: rgba(0,212,255,0.4); }

    .dropdown-vazio {
      padding: 1rem 1.1rem;
      color: var(--texto-suave); font-size: 0.85rem; opacity: 0.7; font-style: italic;
      font-family: var(--mono);
    }

    /* reveal on scroll */
    .coluna { opacity: 0; transform: translateY(18px); animation: rise 0.6s ease forwards; }
    .coluna:nth-child(1) { animation-delay: 0.05s; }
    .coluna:nth-child(2) { animation-delay: 0.18s; }
    .coluna:nth-child(3) { animation-delay: 0.31s; }
    @keyframes rise { to { opacity: 1; transform: none; } }

    /* ═══ Rodapé ═══ */
    footer {
      text-align: center; padding-top: 2.2rem;
      border-top: 1px solid var(--borda);
      color: var(--texto-suave); font-size: 0.85rem; margin-top: 3rem;
      font-family: var(--mono);
    }
    footer .dot { margin: 0 0.5rem; opacity: 0.5; }

    /* ═══ Responsivo ═══ */
    @media (max-width: 768px) {
      .colunas { grid-template-columns: 1fr; }
      header h1 { font-size: 2.4rem; }
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="grid-overlay"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="scanlines"></div>

  <div class="container">
    <header>
      <div class="logo-wrap">
        <div class="logo-ring"></div>
        <div class="logo">T</div>
      </div>
      <div class="badge">Sistema Central</div>
      <h1>Tamacavi</h1>
      <p>Uma porta de entrada tecnológica para todos os seus sistemas e ferramentas.</p>
    </header>

    <div class="colunas" id="colunasContainer"></div>

    <footer>
      <span>© <span id="ano"></span> Tamacavi</span>
      <span class="dot">•</span>
      <span>tamacavi.com.br</span>
    </footer>
  </div>

  <script src="sistemas.js"></script>

  <script>
    const container = document.getElementById('colunasContainer');
    document.getElementById('ano').textContent = new Date().getFullYear();

    const COLUNAS = ['financeira', 'agropecuaria', 'futura'];

    // Gera as colunas com dropdowns (com núcleo HUD)
    container.innerHTML = COLUNAS.map((chave, idx) => {
      const cat = SISTEMAS[chave];
      if (!cat) return '';
      const itens = (cat.sistemas && cat.sistemas.length > 0)
        ? cat.sistemas.map(s =>
            `<a class="dropdown-item" href="${s.url}" target="_blank" rel="noopener">
               <span class="icone">${s.icone || '▸'}</span>${s.nome}
             </a>`).join('')
        : '<div class="dropdown-vazio">Nenhum sistema adicionado ainda.</div>';
      return `
        <div class="coluna">
          <div class="dropdown">
            <button class="dropdown-btn">
              <span>${cat.titulo}</span>
              <span class="chevron"></span>
            </button>
            <div class="dropdown-menu">${itens}</div>
          </div>
        </div>`;
    }).join('');

    // Lógica dos dropdowns
    document.querySelectorAll('.dropdown-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const dd = btn.closest('.dropdown');
        document.querySelectorAll('.dropdown.aberto').forEach(o => {
          if (o !== dd) o.classList.remove('aberto');
        });
        dd.classList.toggle('aberto');
      });
    });

    /* ═══ Partículas animadas (canvas) ═══ */
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let W, H, pts;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function initParticles() {
      const count = Math.min(90, Math.floor((W * H) / 16000));
      pts = Array.from({ length: count }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        r: Math.random() * 1.8 + 0.6,
        c: Math.random() > 0.5 ? '79,140,255' : '0,212,255'
      }));
    }

    function tick() {
      ctx.clearRect(0, 0, W, H);
      // linhas de conexão
      for (let i = 0; i < pts.length; i++) {
        for (let j = i + 1; j < pts.length; j++) {
          const dx = pts[i].x - pts[j].x;
          const dy = pts[i].y - pts[j].y;
          const d = Math.hypot(dx, dy);
          if (d < 130) {
            ctx.strokeStyle = `rgba(79,140,255,${(1 - d / 130) * 0.18})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(pts[i].x, pts[i].y);
            ctx.lineTo(pts[j].x, pts[j].y);
            ctx.stroke();
          }
        }
      }
      pts.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.c},0.6)`;
        ctx.shadowBlur = 8; ctx.shadowColor = `rgb(${p.c})`;
        ctx.fill();
        ctx.shadowBlur = 0;
      });
      requestAnimationFrame(tick);
    }

    resize(); initParticles(); tick();
    window.addEventListener('resize', () => { resize(); initParticles(); });
  </script>
</body>
</html>
