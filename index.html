<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamacavi — Sistemas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #05070d;
      --bg-card: rgba(18, 24, 42, 0.6);
      --bg-card-hover: rgba(24, 32, 54, 0.85);
      --texto: #e8eef9;
      --texto-suave: #8fa3c7;
      --acento: #4f8cff;
      --acento-2: #7c5cff;
      --acento-3: #00d4ff;
      --borda: rgba(79, 140, 255, 0.18);
      --sucesso: #22e584;
      --grad: linear-gradient(135deg, var(--acento), var(--acento-2));
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-base);
      color: var(--texto);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Fundo com grades + orbes de luz ─────────────────── */
    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(79, 140, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79, 140, 255, 0.06) 1px, transparent 1px);
      background-size: 44px 44px;
      z-index: 0;
      mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 40%, transparent 100%);
      pointer-events: none;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.5;
      pointer-events: none;
    }
    .orb-1 { width: 480px; height: 480px; background: rgba(79, 140, 255, 0.25); top: -120px; left: -80px; }
    .orb-2 { width: 420px; height: 420px; background: rgba(124, 92, 255, 0.22); top: 10%; right: -120px; }
    .orb-3 { width: 300px; height: 300px; background: rgba(0, 212, 255, 0.16); bottom: -80px; left: 30%; }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 4rem 1.5rem 4rem;
      position: relative;
      z-index: 1;
    }

    /* ── Cabeçalho ───────────────────────────────────────── */
    header {
      text-align: center;
      margin-bottom: 3.5rem;
      position: relative;
    }

    .logo-wrap {
      position: relative;
      display: inline-flex;
      margin-bottom: 1.4rem;
    }
    .logo {
      width: 74px;
      height: 74px;
      border-radius: 20px;
      background: linear-gradient(135deg, #4f8cff, #7c5cff 60%, #00d4ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.1rem;
      font-weight: 800;
      color: white;
      box-shadow: 0 0 30px rgba(79,140,255,0.5), 0 0 80px rgba(124,92,255,0.25);
      position: relative;
      z-index: 1;
    }
    .logo-ring {
      position: absolute;
      inset: -12px;
      border-radius: 26px;
      border: 1px dashed rgba(79,140,255,0.5);
      animation: girar 16s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }

    .badge {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.35rem 1rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--acento-3);
      background: rgba(0, 212, 255, 0.08);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 40px;
      font-family: 'Space Grotesk', sans-serif;
    }

    header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 0.6rem;
      background: linear-gradient(90deg, #e8eef9, #9fc0ff 60%, #00d4ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--texto-suave);
      font-size: 1.1rem;
      max-width: 560px;
      margin: 0 auto;
    }

    /* ── Seções ──────────────────────────────────────────── */
    section { margin-bottom: 3rem; }

    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 1.4rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: var(--texto-suave);
    }
    .section-title .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--acento-3);
      box-shadow: 0 0 12px var(--acento-3);
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--borda), transparent);
    }

    /* ── Grid de cards (glassmorphism) ───────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.1rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--borda);
      border-radius: 18px;
      padding: 1.5rem 1.5rem 1.4rem;
      text-decoration: none;
      color: inherit;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      position: relative;
      overflow: hidden;
      transition: transform 0.25s cubic-bezier(.2,.7,.3,1.2), box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    }
    /* glow no topo do card */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(79,140,255,0.8), transparent);
      opacity: 0.6;
    }
    /* brilho radial que segue o hover */
    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(400px circle at var(--mx, 50%) var(--my, 0%), rgba(79,140,255,0.14), transparent 55%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(79,140,255,0.45);
      transform: translateY(-5px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(79,140,255,0.12);
    }
    .card:hover::after { opacity: 1; }

    .card.destaque {
      border-color: rgba(79,140,255,0.5);
      background: linear-gradient(160deg, rgba(30,40,70,0.85), rgba(14,19,34,0.85));
      box-shadow: 0 0 0 1px rgba(79,140,255,0.15), 0 10px 40px rgba(79,140,255,0.12);
    }
    .card.destaque::after {
      background: radial-gradient(400px circle at var(--mx,50%) var(--my,0%), rgba(124,92,255,0.18), transparent 55%);
    }

    .card-topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-icone {
      width: 46px; height: 46px;
      border-radius: 12px;
      background: rgba(79,140,255,0.12);
      border: 1px solid rgba(79,140,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: inset 0 0 20px rgba(79,140,255,0.06);
    }
    .badge-destaque {
      background: linear-gradient(135deg, rgba(79,140,255,0.2), rgba(124,92,255,0.2));
      color: #9fc0ff;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: 1px solid rgba(79,140,255,0.3);
      font-family: 'Space Grotesk', sans-serif;
    }

    .card-nome {
      font-size: 1.12rem;
      font-weight: 700;
      margin: 0;
      font-family: 'Space Grotesk', sans-serif;
    }
    .card-descricao {
      color: var(--texto-suave);
      font-size: 0.9rem;
      margin: 0;
    }
    .card-link {
      margin-top: auto;
      padding-top: 0.3rem;
      font-size: 0.82rem;
      color: var(--acento-3);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'Space Grotesk', sans-serif;
    }
    .card-link .arrow {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: rgba(0,212,255,0.1);
      border: 1px solid rgba(0,212,255,0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .card:hover .arrow { transform: translateX(4px); background: rgba(0,212,255,0.2); }

    /* ── Estado vazio ────────────────────────────────────── */
    .vazio {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--texto-suave);
      background: var(--bg-card);
      border: 1.5px dashed rgba(79,140,255,0.3);
      border-radius: 18px;
      padding: 3rem 1.5rem;
      backdrop-filter: blur(14px);
      font-size: 0.95rem;
    }
    .vazio code {
      background: rgba(79,140,255,0.15);
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      font-family: 'Space Grotesk', monospace;
      color: #9fc0ff;
    }

    /* ── Rodapé ──────────────────────────────────────────── */
    footer {
      text-align: center;
      padding-top: 2.2rem;
      border-top: 1px solid var(--borda);
      color: var(--texto-suave);
      font-size: 0.85rem;
      position: relative;
    }
    footer a { color: var(--texto-suave); text-decoration: none; }
    footer a:hover { color: #9fc0ff; }
    footer .sep { margin: 0 0.5rem; opacity: 0.5; }

    /* ── Animações de entrada ────────────────────────────── */
    @keyframes surgir {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    header { animation: surgir 0.7s ease both; }
    section { animation: surgir 0.7s ease both; }
    section:nth-of-type(2) { animation-delay: 0.1s; }
    section:nth-of-type(3) { animation-delay: 0.2s; }

    @media (prefers-reduced-motion: reduce) {
      .logo-ring { animation: none; }
      * { animation-duration: 0.01ms !important; }
    }

    /* ── Responsivo ──────────────────────────────────────── */
    @media (max-width: 640px) {
      header h1 { font-size: 2.1rem; }
      .container { padding: 2.5rem 1rem 3rem; }
    }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="container">
    <header>
      <div class="logo-wrap">
        <div class="logo-ring"></div>
        <div class="logo">T</div>
      </div>
      <div class="badge">Sistema Central</div>
      <h1>Tamacavi</h1>
      <p>Uma porta de entrada tecnológica para todos os seus sistemas e ferramentas.</p>
    </header>

    <!-- Os cards são gerados automaticamente aqui -->
    <div id="sistemasContainer"></div>

    <footer>
      <span>© <span id="ano"></span> Tamacavi</span>
      <span class="sep">•</span>
      <span>tamacavi.com.br</span>
    </footer>
  </div>

  <!-- Arquivo de configuração (edite este arquivo) -->
  <script src="sistemas.js"></script>

  <script>
    const container = document.getElementById('sistemasContainer');
    document.getElementById('ano').textContent = new Date().getFullYear();

    const CATEGORIAS = [
      { chave: 'internos', titulo: 'Sistemas Internos', icone: '🛠️' },
      { chave: 'clientes', titulo: 'Sistemas para Clientes', icone: '💼' },
      { chave: 'landing', titulo: 'Landing Pages', icone: '🌐' }
    ];

    const ativas = CATEGORIAS.filter(cat => (SISTEMAS[cat.chave] || []).length > 0);

    // Efeito glow que segue o mouse dentro de cada card
    document.addEventListener('mousemove', (e) => {
      document.querySelectorAll('.card').forEach(card => {
        const r = card.getBoundingClientRect();
        const x = e.clientX - r.left;
        const y = e.clientY - r.top;
        card.style.setProperty('--mx', x + 'px');
        card.style.setProperty('--my', y + 'px');
      });
    });

    if (ativas.length === 0) {
      container.innerHTML = `
        <div class="vazio">
          <div style="font-size:2.6rem;margin-bottom:0.8rem">🚀</div>
          <strong>Nenhum sistema cadastrado ainda.</strong><br>
          Abra o arquivo <code>sistemas.js</code><br>
          e siga as instruções para adicionar seus sistemas.
        </div>`;
    } else {
      const html = ativas.map((cat, idx) => {
        const cards = SISTEMAS[cat.chave]
          .map(s => {
            const destaqueCls = s.destaque ? ' destaque' : '';
            const destaqueBadge = s.destaque
              ? '<span class="badge-destaque">Destaque</span>' : '';
            return `
              <a class="card${destaqueCls}" href="${s.url}" target="_blank" rel="noopener">
                <div class="card-topo">
                  <span class="card-icone">${s.icone || '📄'}</span>
                  ${destaqueBadge}
                </div>
                <h3 class="card-nome">${s.nome}</h3>
                <p class="card-descricao">${s.descricao || ''}</p>
                <span class="card-link">Abrir sistema <span class="arrow">→</span></span>
              </a>`;
          }).join('');

        return `
          <section>
            <h2 class="section-title"><span class="dot"></span>${cat.titulo}</h2>
            <div class="grid">${cards}</div>
          </section>`;
      }).join('');

      container.innerHTML = html;
    }
  </script>
</body>
</html>
